interface:
  display_name: "主脑与苦力 Agent"
  short_description: "直接派工给外部 Agent，回读原始报告并独立验收"
  default_prompt: "使用 $brain-worker 锁定当前目标、项目路径与授权。本机代码开发和入口补修默认 Qoder / Qwen3.8-Flash；用户明确指定 CodeBuddy 或 ZCode 时按对应正式入口及本机配置派工。不可用时如实报告，不静默更换。未配置直连且用户选择人工转发时提供完整可复制提示词。直连使用对应操作参考的九节兼容报告，原文存档、模型与会话核对、哈希回读后独立验收；收到报告并验收前不追加指令，不调用 Codex 子 Agent。每阶段按真实证据记录评分，结束直接显示来回总数及每轮总结，并完成已授权 GitHub 和 Obsidian 收尾。"
