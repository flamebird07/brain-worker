interface:
  display_name: "主脑与苦力 Agent"
  short_description: "直接派工给外部 Agent，回读原始报告并独立验收"
  default_prompt: "使用 $brain-worker 从当前业务目标主动选择已就绪、已授权的外部执行器；代码开发默认 Qoder / Qwen3.8-Flash，其他执行器按已有授权与最新能力台账选择，不等待每轮点名。独立成果用隔离副本和逐任务计划并行，依赖或共享写入串行；同一在途任务不改提示词、不重复派发。入口不可用时保留失败证据，按授权兜底。回读原始九节报告和实际发送载荷，独立验收业务；不调用 Codex 子 Agent、不代写报告。每阶段按真实证据记录评分，结束显示来回总数与逐轮总结，并完成已授权 GitHub 和 Obsidian 收尾。个人版免费积分目的保留，未知成本不称免费。"
