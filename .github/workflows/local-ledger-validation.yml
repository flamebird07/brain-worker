name: local-ledger-validation

# BW-DUAL-07：Windows/Linux 全量测试矩阵；push 触发分支：bw-dual-final-validation、dual-mode-brain、main。
# 仅读权限、无业务 Secrets、不请求真实飞书或付费 API；测试失败保留日志 artifact。

on:
  push:
    branches:
      - bw-dual-final-validation
      - dual-mode-brain
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 纯 local 隔离检查：默认后端 local_ledger.py + 共享核心 ledger_core.py
      # 仅以标准库即可导入并通过（test_local_ledger 经真实 CLI 子进程覆盖）；
      # PyYAML 仅为飞书 YAML 配置测试所需，不是默认后端依赖。
      # 注：test_ledger_core 的飞书 CLI 入口用例预期"缺少必需飞书配置"，
      # 其设计前提为 PyYAML 已安装，故归入下方四套全量步骤，不进本隔离检查。
      - name: Pure-local isolation check (stdlib only, no PyYAML)
        shell: bash
        run: |
          set -o pipefail
          python -m pip uninstall -y pyyaml || true
          python - <<'EOF'
          try:
              import yaml  # noqa: F401
          except ImportError:
              print("PyYAML not importable: pure-local isolation OK")
          else:
              raise SystemExit("PyYAML unexpectedly importable; isolation check invalid")
          EOF
          python -c "import scripts.ledger_core, scripts.local_ledger; print('stdlib-only import OK: ledger_core, local_ledger')"
          python -m unittest scripts.test_local_ledger -v 2>&1 | tee 01-pure-local-stdlib-check.txt

      # PyYAML 仅用于飞书 YAML 配置测试；纯 local 后端不依赖它。
      - name: Install PyYAML (config tests only)
        run: python -m pip install pyyaml

      # 四套测试逐项执行；tee + pipefail 保留真实退出码，失败不吞掉。
      - name: Run four test suites (exact command)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest scripts.test_ledger_core scripts.test_local_ledger scripts.test_capability_config scripts.test_capability_ledger -v 2>&1 | tee 02-four-suites-output.txt

      - name: Qoder direct transport regression (no login or network)
        run: python tests/test_qoder_direct_offline.py

      - name: Qoder direct binding regression (no login or network)
        run: python tests/test_qoder_direct_binding_offline.py

      - name: Qoder direct permissions regression (no login or network)
        run: python tests/test_qoder_direct_permissions_offline.py

      # BW-ZCODE-INSTALL-01：ZCode 官方运行时入口的离线回归。真实子进程 stub 承载，
      # 不登录 BigModel、不访问网络、不调用任何模型，也不证明真实 ZCode 后端能力。
      - name: ZCode direct transport regression (no login or network)
        run: python tests/test_zcode_direct_offline.py

      - name: ZCode SDK runner syntax check (no execution)
        run: node --check scripts/zcode_sdk_runner.mjs

      - name: ZCode actual SDK adapter offline regression
        run: python tests/test_zcode_sdk_runner.py

      # BW-GITHUB-CLOSEOUT-20261008-S3：CodeBuddy/WorkBuddy 直连退休为 human-relay only。
      # 生产 codebuddy_direct.main 在读配置/提示词/建输出/quota gate/Popen 前固定拒绝；
      # 旧 CB 真实 stub 传输链改由测试专用离线 harness（tests/offline_codebuddy_harness.py）
      # 调 dispatch_core 在隔离合成 stub 下回放，不接真实运行时/账号。无网络、不调模型。
      - name: CodeBuddy legacy pipeline offline replay (retired direct, synthetic stub)
        run: python tests/test_codebuddy_direct.py

      - name: Manual-relay retirement refusal regression (control plane + production CLI)
        run: python tests/test_manual_relay_routing.py

      - name: Task dispatch control offline regression
        run: python tests/test_execution_control.py

      # BW-GITHUB-CLOSEOUT-20261008-S6：全局并发容量池（2 Zcode + 2 Max + 2 Flash 国内六
      # 名额、1:1 轮转、Luna 救援票据裁决、跨 OS 进程并发初始化与 adopt-legacy 真实旧原件
      # schema）的离线回归，Windows/Linux 矩阵都跑。三套 test_dispatch_pool* 全部使用每
      # 用例独立临时 SQLite（setUp 显式断言 store != dispatch_pool.default_store_path()，
      # 绝不读写真实 ~/.brain-worker 池）、随包固定合成 stub 与可注入假 PID 探针；无网络、
      # 不登录、不调用任何真实模型。先核验固定合成 stub 已随包，保证离线入口回归可复现。
      - name: Verify fixed synthetic stubs are packaged (offline, no real runtime)
        shell: bash
        run: |
          set -o pipefail
          for f in tests/stub_qodercli.py tests/offline_codebuddy_stub.py tests/stub_zcode_runner.py; do
            test -f "$f" || { echo "missing packaged stub: $f" >&2; exit 1; }
          done
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          import dispatch_pool as dp
          # 本地测试口径：默认真实库路径必须存在且测试绝不指向它（各用例 setUp 自断言）。
          print('default real pool path (never used by tests):', dp.default_store_path())
          print('packaged fixed synthetic stubs present; dispatch pool tests use temp SQLite')
          EOF

      - name: Dispatch pool core offline regression (temp SQLite, no real pool)
        run: python -m unittest discover -s tests -p "test_dispatch_pool.py" -v

      - name: Dispatch pool revision offline regression (temp SQLite, no real pool)
        run: python -m unittest discover -s tests -p "test_dispatch_pool_revision.py" -v

      - name: Dispatch pool multiprocess offline regression (cross-OS spawn, temp SQLite)
        run: python -m unittest discover -s tests -p "test_dispatch_pool_multiprocess.py" -v

      - name: Parallel and fallback offline regression
        run: python tests/test_parallel_execution.py

      # BW-GLOBAL-POOL-20261008-Z5/Z6：原生 Luna 终态收口（settle-native）的离线回归
      # （临时 SQLite + 注入时钟，17 项隔离合成验证；无网络、不登录、不调真实模型、
      # 不读写真实 ~/.brain-worker 池）。
      - name: Native lifecycle settle-native offline regression (temp SQLite, no real pool)
        run: python -m unittest discover -s tests -p "test_native_lifecycle.py" -v

      # Qoder/ZCode 与 CodeBuddy 历史直连链路的九节契约 + 实际发送载荷取证
      # （真实子进程/SDK receipts 的离线回放，无网络、不调模型；CB 生产已退休为
      # human-relay only，此处仅为历史离线回放，不代表 CB 生产可直连）。
      - name: Prompt contract and sent-payload evidence offline regression
        run: python tests/test_prompt_contract.py

      # BW-QUOTA-20261008 修复链路的离线回归：额度持久门禁、执行证据归并与权限 broker。
      # 无网络、无真实模型、无真实 CLI；测试素材来自随包 tests/fixtures/quota-terminal.synthetic.json
      # 与合成 stub，绝不写真实 ~/.brain-worker 状态。
      - name: Quota control persistent gate offline regression
        run: python tests/test_quota_control.py

      # BW-AVAILABILITY-20261009-B2：ZCode 独立持久 availability/防重复状态 + 资格过滤
      # 路由（显式 Qoder 不被历史计数改道、auto 只在可用主力间 1:1）+ Luna 降级/回复
      # 状态机 + 真实入口接入（合成 stub，sent=false / 零模型调用）的离线回归。全部使用
      # 每用例独立临时 SQLite（setUp 自断言 store != default_store_path()）与随包固定合成
      # stub，绝不读写真实 ~/.brain-worker 或 offline-state 池；Windows/Linux 矩阵都跑。
      # BW-AVAILABILITY-20261009-B4：同文件补齐 7 缺口加固回归（CAS 授予行精确键、
      # 单次恢复资格消耗、probe 绑定票据容量闸、只读诊断不建库、429 先记后释放竞态、
      # executor+runtime+model combo 硬约束贯穿 reserve/select/consume/claim_due、
      # settled 票据不被迟到回复重开、物理六满与合格候选耗尽分列）；先补能在当前 B2 失败的
      # 负例、修复后全绿，命令与矩阵不变。
      - name: Availability routing and Luna state machine offline regression (temp SQLite, no real pool)
        run: python -m unittest discover -s tests -p "test_availability_routing.py" -v

      - name: ZCode execution evidence offline regression
        run: python tests/test_zcode_execution_evidence.py

      - name: ZCode permission broker syntax check (no execution)
        run: node --check scripts/zcode_permission_broker.mjs

      - name: ZCode permission broker offline regression
        run: python tests/test_zcode_permission_broker.py

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            01-pure-local-stdlib-check.txt
            02-four-suites-output.txt
          if-no-files-found: error
