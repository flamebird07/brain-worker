name: local-ledger-validation

on:
  push:
    branches:
      - bw-dual-02-linux-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ledger-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run local_ledger regression tests
        run: python -m scripts.test_local_ledger -v
